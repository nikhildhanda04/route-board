<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- The chart's materials at icon scale: a duplicator-blue field, the bus in
       school-bus yellow, square corners. Drawn in side profile rather than as
       the interface's line glyph, which reads as a crate once it is this big. -->
  <rect width="512" height="512" fill="#2E3A8C"/>
  <g transform="translate(96 150) scale(13.3)" fill="#F0AE07">
    <!-- body -->
    <rect x="0" y="0" width="24" height="12"/>
    <!-- wheels -->
    <rect x="3.5" y="12" width="4.5" height="3"/>
    <rect x="16" y="12" width="4.5" height="3"/>
    <!-- windows, cut out of the body -->
    <g fill="#2E3A8C">
      <rect x="2" y="2" width="4.5" height="4"/>
      <rect x="8" y="2" width="4.5" height="4"/>
      <rect x="14" y="2" width="4.5" height="4"/>
      <rect x="20" y="2" width="2" height="4"/>
    </g>
  </g>
</svg>
